name: Daily Garmin export

on:
  schedule:
    # 07:00 Israel time (IDT = UTC+3). GitHub cron is UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Public repo: never grant the default write token.
permissions:
  contents: read

jobs:
  export:
    name: Sync Garmin facts to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Require token secret
        env:
          GARMIN_TOKEN_OMER: ${{ secrets.GARMIN_TOKEN_OMER }}
        run: |
          if [ -z "$GARMIN_TOKEN_OMER" ]; then
            echo "::error::Add repo secret GARMIN_TOKEN_OMER (output of: poetry run pacerai --user omer export-token)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install package
        run: poetry install --only main

      # Health data (sleep, HRV, weight, activities) is written only to Supabase.
      # Never dump it to workflow logs or GitHub Actions artifacts on a public repo.
      - name: Sync facts to Supabase
        env:
          GARMIN_TOKEN_OMER: ${{ secrets.GARMIN_TOKEN_OMER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::error::Set repo secrets SUPABASE_URL and SUPABASE_SERVICE_KEY. Raw Garmin JSON is not stored on GitHub."
            exit 1
          fi
          poetry run pacerai --user omer sync-facts --days 3
