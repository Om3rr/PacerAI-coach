name: Daily Garmin export

on:
  schedule:
    # 07:00 Israel time (IDT = UTC+3). GitHub cron is UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  export:
    name: Export Omer's Garmin data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Require token secret
        env:
          GARMIN_TOKEN_OMER: ${{ secrets.GARMIN_TOKEN_OMER }}
        run: |
          if [ -z "$GARMIN_TOKEN_OMER" ]; then
            echo "::error::Add repo secret GARMIN_TOKEN_OMER (output of: poetry run pacerai --user omer export-token)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install package
        run: poetry install --only main

      - name: Export today's snapshot
        env:
          GARMIN_TOKEN_OMER: ${{ secrets.GARMIN_TOKEN_OMER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p export
          poetry run pacerai --user omer activities --limit 10 > export/activities.json
          poetry run pacerai --user omer sleep > export/sleep.json
          poetry run pacerai --user omer stats > export/stats.json
          poetry run pacerai --user omer hrv > export/hrv.json
          poetry run pacerai --user omer training-status > export/training-status.json || true
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_SERVICE_KEY:-}" ]; then
            poetry run pacerai --user omer sync-facts --days 3 > export/sync-facts.json || true
          fi
          python3 - <<'PY'
          import json, pathlib
          out = pathlib.Path("export")
          summary = {}
          for p in sorted(out.glob("*.json")):
              try:
                  summary[p.stem] = json.loads(p.read_text()).get("status")
              except Exception as e:
                  summary[p.stem] = f"parse-error: {e}"
          print(json.dumps({"export_statuses": summary}, indent=2))
          PY

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pacerai-omer-${{ github.run_id }}
          path: export/
          retention-days: 14
